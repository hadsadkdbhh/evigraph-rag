name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run MVP0 acceptance checks
        run: python scripts/run_mvp0_acceptance.py

      - name: Compile sources
        run: python -m compileall evigraph scripts tests
