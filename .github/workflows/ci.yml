name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python scripts/run_tests.py

      - name: Run feasibility suite
        run: python scripts/run_feasibility.py --corpus data/corpus --report outputs/eval/feasibility_report.json

      - name: Run stress manifest
        run: python scripts/run_manifest.py --manifest configs/experiments.stress.json

      - name: Compile sources
        run: python -m compileall evigraph scripts tests
